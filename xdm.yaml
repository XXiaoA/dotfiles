create:
  - ~/Workspace

link:
  ./fish/:
    path: ~/.config/fish
    force: true

  ./gitconfig/gitconfig: ~/.gitconfig

  ~/Workspace/nvimrc/:
    path: ~/.config/nvim
    exist: false

  ./starship/starship.toml: ~/.config/starship.toml

  ./tmux/tmux.conf: ~/.tmux.conf

  ./mini-vimrc/vimrc: ~/.vimrc

  ./kitty/: ~/.config/kitty

  ./termux/:
    path: ~/.termux
    force: true
    manual: true

  ./keymapper/keymapper.conf: ~/.config/keymapper.conf

  ./neofetch/config.conf:
    path: ~/.config/neofetch/config.conf
    force: true

  ./hypr/: ~/.config/hypr

  ./imv/: ~/.config/imv

  ./mpv/: ~/.config/mpv

  ./noctalia/config.toml: ~/.config/noctalia/config.toml

  ./noctalia/settings.toml: ~/.local/state/noctalia/settings.toml

  ./fonts/Feather.ttf: ~/.local/share/fonts/Feather.ttf

  "./fonts/Font Awesome 6 Pro-Solid-900.otf": "~/.local/share/fonts/Font Awesome 6 Pro-Solid-900.otf"

  ./fonts/MaterialDesignIconsDesktop.ttf: ~/.local/share/fonts/MaterialDesignIconsDesktop.ttf

  ./fonts/MesloLGS_NF_Regular.ttf: ~/.local/share/fonts/MesloLGS_NF_Regular.ttf
